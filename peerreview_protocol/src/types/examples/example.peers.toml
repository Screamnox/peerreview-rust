# Configuration des pairs d'un noeud

# Pour ajouter un nouveau nœud :
# 1. Générer sa keypair avec ed25519-dalek
# 2. Encoder la clé publique en base64
# 3. Ajouter une entrée [[peers]] ici
# 4. Distribuer ce fichier à tous les nœuds

[[peers]]
id = 42
address = "127.0.0.1:5000"
# Clé publique Ed25519 encodée en base64
public_key = "jKHN8O6FXANLQZx0fGDWEAkPq8fKZXVBkXu0W/J1234="
witnesses = [43, 44]

