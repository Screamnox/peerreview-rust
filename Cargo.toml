[package]
name = "peerreview-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4"
base64 = "0.22"
sha2 = "0.10.9"
ed25519-dalek = "1.0"
rand = "0.7"
bincode = "2.0.1"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
mio = { version = "1.1.1", features = ["os-poll", "net"] }

[dev-dependencies]
tracing-subscriber = "0.3.22"
