[package]
name = "gossip_node"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
# bincode v1 (serde) pour Msg / BinaryChunk
bincode = "1"

# bincode v2 (Encode/Decode) renommé en bincode2 pour PeerReviewMsg
bincode2 = { package = "bincode", version = "2", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
time = "0.3"
axum = { version = "0.7", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace"] }
# pour l'état partagé et les collections
dashmap = "5"
parking_lot = "0.12"
rand = "0.8"
rand_chacha = "0.3"
rand_core = "0.6"
ed25519-dalek = "2"
common_proto = { path = "../../crates/common_proto" }
peerreview_protocol = { path = "../../peerreview_protocol" }
base64 = "0.22"
