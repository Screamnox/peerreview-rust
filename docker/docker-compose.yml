services:
  node1: &node
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: node1
    command: ["--name","node1","--cluster","configs/docker/cluster.yaml","--log-dir","peerreview_logs","--http","--fault","forge_recv_from=node4"]
    ports: ["8081:8081"]
    networks:
      gossip_net:
        ipv4_address: 172.30.0.11
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/stats"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s

  node2:
