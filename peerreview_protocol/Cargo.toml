[package]
name = "peerreview_protocol"
version = "0.1.0"
edition = "2024"

[features]
peerreview_full = []

[dependencies]
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

bincode = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"

ed25519-dalek = "2"
signature = "2"
sha2 = "0.10"
hex = "0.4"

