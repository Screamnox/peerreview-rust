[package]
name = "gossip_node"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tokio = { version = "1.48", features = ["full"] }

axum = "0.7"
tower-http = { version = "0.6", features = ["trace"] }

rand = "0.8"
sha2 = "0.10"

common_proto = { path = "../../crates/common_proto" }
peerreview_protocol = { path = "../../peerreview_protocol" }
ed25519-dalek = "2"
clap = { version = "4", features = ["derive"] }
bincode = "2"
hex = "0.4"
