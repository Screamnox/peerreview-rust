[package]
name = "peerreview_protocol"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pr_verify"
path = "src/bin/pr_verify.rs"

[[bin]]
name = "pr_verify_cluster"
path = "src/bin/pr_verify_cluster.rs"

[[bin]]
name = "pr_audit_live"
path = "src/bin/pr_audit_live.rs"

[dependencies]
anyhow = "1"
# Crypto / hash
ed25519-dalek = "2.2"
sha2 = "0.10"
hex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
base64 = "0.22"
serde_yaml = "0.9"


# Network / async (si tu utilises runtime/network)
tokio = { version = "1.48", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "time",
  "io-util"
] }

# PeerReview messages encoding (si vous encodez des messages PR)
bincode = "2.0.1"

# CLI
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "pr_audit_app"
path = "src/bin/pr_audit_app.rs"
